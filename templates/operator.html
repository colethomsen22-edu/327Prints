<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>327Prints - Operator Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div class="container my-4">
    <header class="d-flex justify-content-between align-items-center mb-4">
        <h1>327Prints | Operator Management</h1>
        <div>
            <a href="/" class="btn btn-outline-secondary me-2">Public Queue</a>
            <a href="/intake" class="btn btn-outline-primary">Intake Form</a>
        </div>
    </header>

    <!-- Top Metric Cards -->
    <div class="row mb-4">
        <div class="col-md-4">
            <div class="card shadow-sm border-start border-primary border-4">
                <div class="card-body">
                    <h6 class="text-muted text-uppercase mb-1">Queue Total</h6>
                    <h2 class="mb-0" id="stat-total-jobs">0</h2>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card shadow-sm border-start border-warning border-4">
                <div class="card-body">
                    <h6 class="text-muted text-uppercase mb-1">Pending Jobs</h6>
                    <h2 class="mb-0" id="stat-pending-jobs">0</h2>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card shadow-sm border-start border-success border-4">
                <div class="card-body">
                    <h6 class="text-muted text-uppercase mb-1">Printers Active</h6>
                    <h2 class="mb-0">2 / 2</h2>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Queue Management Table -->
    <div class="card shadow-sm">
        <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
            <h5 class="mb-0">Queue Control Table</h5>
            <button class="btn btn-sm btn-light" onclick="loadOperatorQueue()">Refresh</button>
        </div>
        <div class="card-body">
            <table class="table table-hover align-middle">
                <thead>
                    <tr>
                        <th>Job ID</th>
                        <th>Requester</th>
                        <th>Status</th>
                        <th>Time Remaining</th>
                        <th class="text-end">Quick Actions</th>
                    </tr>
                </thead>
                <tbody id="operator-queue-body">
                    <!-- Dynamic Rows -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    async function loadOperatorQueue() {
        try {
            const response = await fetch('/api/jobs/queue');
            const jobs = await response.json();
            const tbody = document.getElementById('operator-queue-body');
            tbody.innerHTML = '';

            let totalJobs = jobs.length;
            let pendingJobs = 0;

            jobs.forEach(job => {
                if (job.Current_status === 'Pending') pendingJobs++;

                let statusBadge = 'bg-secondary';
                if (job.Current_status === 'Printing') statusBadge = 'bg-success';
                else if (job.Current_status === 'Pending') statusBadge = 'bg-warning text-dark';
                else if (job.Current_status === 'Completed') statusBadge = 'bg-info text-dark';
                else if (job.Current_status === 'Failed') statusBadge = 'bg-danger';

                const row = `
                    <tr>
                        <td><strong>#${job.Job_ID}</strong></td>
                        <td>${job.First_name} ${job.Last_name}</td>
                        <td><span class="badge ${statusBadge}">${job.Current_status}</span></td>
                        <td>${job.Time_remaining} mins</td>
                        <td class="text-end">
                            <button class="btn btn-sm btn-outline-success me-1" onclick="updateStatus(${job.Job_ID}, 'Printing')">Start</button>
                            <button class="btn btn-sm btn-outline-info me-1" onclick="updateStatus(${job.Job_ID}, 'Completed')">Complete</button>
                            <button class="btn btn-sm btn-outline-danger" onclick="updateStatus(${job.Job_ID}, 'Failed')">Fail</button>
                            <a href="/email-preview/${job.Job_ID}" target="_blank" class="btn btn-sm btn-secondary ms-2">Email</a>
                        </td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });

            document.getElementById('stat-total-jobs').innerText = totalJobs;
            document.getElementById('stat-pending-jobs').innerText = pendingJobs;

        } catch (error) {
            console.error('Error fetching queue:', error);
        }
    }

    async function updateStatus(jobId, newStatus) {
        try {
            const response = await fetch('/api/jobs/update-status', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ job_id: jobId, status: newStatus })
            });

            const result = await response.json();
            if (result.status === 'success') {
                loadOperatorQueue();
            } else {
                alert('Update failed: ' + result.message);
            }
        } catch (error) {
            console.error('Error updating status:', error);
        }
    }

    loadOperatorQueue();
</script>
</body>
</html>
