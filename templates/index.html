<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>327Prints - Public Queue</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div class="container my-4">
    <header class="d-flex justify-content-between align-items-center mb-4">
        <h1>327Prints | Luter 327 Lab</h1>
        <a href="/intake" class="btn btn-primary">Submit New Print</a>
    </header>

    <div class="row">
        <!-- Left Column: Active Queue -->
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-dark text-white">
                    <h5 class="card-title mb-0">Current Print Queue</h5>
                </div>
                <div class="card-body">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>Pos</th>
                                <th>Requester</th>
                                <th>Status</th>
                                <th>Time Remaining</th>
                            </tr>
                        </thead>
                        <tbody id="queue-table-body">
                            <!-- Populated dynamically via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Right Column: Live Bambu Telemetry -->
        <div class="col-md-4">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-dark text-white">
                    <h5 class="card-title mb-0">Bambu X1C Telemetry</h5>
                </div>
                <div class="card-body">
                    <div class="d-flex justify-content-between mb-3">
                        <span class="text-muted fw-bold">Status:</span>
                        <span id="printer-status-text" class="badge bg-secondary">CONNECTING...</span>
                    </div>

                    <div class="row text-center mb-4">
                        <div class="col-6 border-end">
                            <h6 class="text-muted mb-1">Nozzle Temp</h6>
                            <h4 id="printer-nozzle-temp" class="text-danger mb-0">--°C</h4>
                        </div>
                        <div class="col-6">
                            <h6 class="text-muted mb-1">Bed Temp</h6>
                            <h4 id="printer-bed-temp" class="text-warning mb-0">--°C</h4>
                        </div>
                    </div>

                    <h6 class="text-muted mb-2">Print Progress <span id="printer-time-left" class="float-end text-dark small">-- mins left</span></h6>
                    <div class="progress" style="height: 25px;">
                        <div id="printer-progress-bar" class="progress-bar progress-bar-striped progress-bar-animated bg-success" style="width: 0%;">0%</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Fetch queue data from PostgreSQL API and render in table
    async function loadQueue() {
        try {
            const response = await fetch('/api/jobs/queue');
            const jobs = await response.json();
            const tbody = document.getElementById('queue-table-body');
            tbody.innerHTML = '';

            jobs.forEach(job => {
                const row = `
                    <tr>
                        <td>${job.Queue_position}</td>
                        <td>${job.First_name} ${job.Last_name}</td>
                        <td><span class="badge ${job.Current_status === 'Printing' ? 'bg-success' : 'bg-warning text-dark'}">${job.Current_status}</span></td>
                        <td>${job.Time_remaining} mins</td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        } catch (error) {
            console.error('Error fetching queue:', error);
        }
    }

    // Fetch real-time Bambu printer telemetry via MQTT backend endpoint
    async function loadPrinterTelemetry() {
        try {
            const response = await fetch('/api/printer/status');
            const data = await response.json();

            if (data.status === 'success' && Object.keys(data.telemetry).length > 0) {
                const t = data.telemetry;

                // Update Status Badge
                const statusBadge = document.getElementById('printer-status-text');
                statusBadge.innerText = t.gcode_state;
                statusBadge.className = t.gcode_state === 'RUNNING' ? 'badge bg-success' : 'badge bg-primary';

                // Update Temps
                document.getElementById('printer-nozzle-temp').innerText = t.nozzle_temper + '°C';
                document.getElementById('printer-bed-temp').innerText = t.bed_temper + '°C';

                // Update Progress Bar
                const progressBar = document.getElementById('printer-progress-bar');
                progressBar.style.width = t.mc_percent + '%';
                progressBar.innerText = t.mc_percent + '%';

                // Update Time Remaining
                document.getElementById('printer-time-left').innerText = t.mc_remaining_time + ' mins left';
            }
        } catch (error) {
            console.error('Error fetching printer telemetry:', error);
        }
    }

    // Load initial data
    loadQueue();
    loadPrinterTelemetry();

    // Poll the printer endpoint every 10 seconds
    setInterval(loadPrinterTelemetry, 10000);
</script>
</body>
</html>
